<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>回声:枯荣之环 — Echoes: The Witherbloom Cycle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a1428'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23b78ce0'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root {
    --ink:        #0c0a14;
    --ink-2:      #14101e;
    --ink-3:      #1c1730;
    --parch:      #d6c8a4;
    --parch-dim:  #8b7f5e;
    --gold:       #e0b76a;
    --gold-soft:  #b8945a;
    --moss:       #6fb872;
    --ember:      #e87a3c;
    --frost:      #8aa9c4;
    --violet:     #b78ce0;
    --crimson:    #c14d4d;
    --hp:         #d65858;
    --mp:         #6c8ee0;
    --xp:         #d8b04a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); color: var(--parch); font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
  body { display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }

  #stage { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }

  /* Pixel-perfect rendering: integer scaling, image-rendering: pixelated */
  canvas#game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    image-rendering: -moz-crisp-edges;
    background: var(--ink);
    box-shadow: 0 0 60px rgba(183, 140, 224, 0.15), 0 0 200px rgba(0,0,0,0.8);
    cursor: crosshair;
  }

  /* Boot screen */
  #boot {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #1c1730 0%, #0c0a14 70%);
    z-index: 100; transition: opacity 0.6s ease;
  }
  #boot .glyph { font-size: 64px; color: var(--violet); text-shadow: 0 0 20px var(--violet); animation: pulse 2.4s ease-in-out infinite; }
  #boot .title { font-size: 22px; color: var(--parch); margin-top: 24px; letter-spacing: 4px; }
  #boot .sub   { font-size: 12px; color: var(--parch-dim); margin-top: 10px; letter-spacing: 2px; }
  #boot .bar   { margin-top: 36px; width: 320px; height: 4px; background: var(--ink-3); border-radius: 2px; overflow: hidden; }
  #boot .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--violet), var(--gold)); transition: width 0.3s ease; }
  @keyframes pulse { 0%,100% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }

  /* Mobile / tiny screens hint —— 仅当宽与高都极小时才提示(横屏手机可正常游玩) */
  #tooSmall { display: none; position: absolute; inset: 0; background: var(--ink); color: var(--parch); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  @media (max-width: 520px) and (max-height: 360px) { #tooSmall { display: flex; } }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>

    <div id="boot">
      <div class="glyph">◉</div>
      <div class="title">回声 · 枯荣之环</div>
      <div class="sub">E C H O E S &nbsp; · &nbsp; T H E &nbsp; W I T H E R B L O O M &nbsp; C Y C L E</div>
      <div class="bar"><i id="bootBar"></i></div>
      <div class="sub" id="bootMsg" style="margin-top: 14px;">正在唤醒王树…</div>
    </div>

    <div id="tooSmall">
      <div style="font-size: 48px;">⚠</div>
      <p style="margin-top: 20px; font-size: 16px; line-height: 1.7;">请使用更大的窗口,或横屏使用手机<br/><span style="color: var(--parch-dim); font-size: 12px;">建议 800 × 500 以上</span></p>
    </div>
  </div>

  <!--
    单一外壳:优先加载构建产物 dist/game.js(`npm run build` 生成,单请求,无模块瀑布);
    产物不存在时自动回退直读 src/main.js(dev 模式,静态服务器打开即可)。
  -->
  <script type="module">
    try { await import('./dist/game.js'); }
    catch { await import('./src/main.js'); }
  </script>
</body>
</html>
